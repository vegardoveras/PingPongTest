<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pong Levels</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <section id="hud">
            <div class="hud-item">Level: <span id="levelLabel">1</span>/5</div>
            <div class="hud-item">You: <span id="playerScore">0</span></div>
            <div class="hud-item">AI: <span id="aiScore">0</span></div>
        </section>

        <div id="gameWrap">
            <canvas id="pongCanvas" width="360" height="640"></canvas>
            <div id="overlay" class="show">
                <h1>Pong Challenge</h1>
                <p id="overlayText">Touch and drag to control your paddle. Beat 5 levels.</p>
                <button id="startBtn" type="button">Start Game</button>
            </div>
        </div>
    </main>
    <script src="game.js"></script>
</body>
</html>
